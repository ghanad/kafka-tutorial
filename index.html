<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="دوره تعاملی و فارسی آموزش Apache Kafka از مفاهیم پایه تا معماری، تولید، مصرف، اطمینان‌پذیری و اکوسیستم."
    />
    <meta name="theme-color" content="#312e81" />
    <title>آموزش جامع Apache Kafka | از صفر تا تولید</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('kafka-tutorial-store')
          var theme = raw ? JSON.parse(raw).state.theme : 'light'
          if (theme !== 'dark' && theme !== 'light') theme = 'light'
          document.documentElement.classList.toggle('dark', theme === 'dark')
          document.documentElement.style.colorScheme = theme
        } catch (error) {
          document.documentElement.classList.remove('dark')
          document.documentElement.style.colorScheme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
